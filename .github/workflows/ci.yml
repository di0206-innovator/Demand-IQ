name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Run pytest test suite with coverage
        run: uv run pytest --cov=demandiq --cov-report=term-missing

  build-and-package:
    name: Package Build & Smoke Test
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build package distribution (wheel & sdist)
        run: uv build

      - name: Verify package artifact install and import
        run: |
          uv venv test_env
          uv pip install --python test_env dist/*.whl
          test_env/bin/python -c "import demandiq; print('DemandIQ version:', demandiq.__version__)"
